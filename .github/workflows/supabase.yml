name: Datenbank & Push-Funktionen bereitstellen

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Projekt verbinden
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Datenbank aktualisieren
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Geheimnisse für Push setzen
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}"
      - name: Login-Einstellungen und E-Mail-Vorlage übernehmen
        run: supabase config push --project-ref "$PROJECT_REF" --yes
      - name: Funktionen bereitstellen
        run: supabase functions deploy --project-ref "$PROJECT_REF"
